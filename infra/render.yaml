# Render reference config (PRD 30).
#
# The preferred production shape for this repo is one Docker web service plus
# managed Postgres:
# - Next.js listens on Render's public $PORT.
# - FastAPI listens privately on 127.0.0.1:8000 inside the same container.
# - Next rewrites /api/* to the private FastAPI process via BACKEND_URL.
# - All heavy backtests and nightly maintenance use disposable child processes in
#   this same Starter web service. Sweeps, account sleeves, and headline refreshes
#   get one fresh child per unit so allocator high-water memory cannot accumulate.
#   No paid worker, Cron Job, or plan change.
#
# The project is provisioned manually in Render; this file documents the same
# settings for review or future Blueprint use.

databases:
  - name: financial-atlas-db
    plan: free
    diskSizeGB: 1
    databaseName: atlas

services:
  - type: web
    name: financial-atlas
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    disk:
      name: disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-atlas-db
          property: connectionString
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CACHE_DIR
        value: /var/data/cache
      - key: CACHE_MAX_MB
        value: 512
      - key: CACHE_MIN_FREE_MB
        value: 128
      # Disposable heavy workers self-stop while this much cgroup headroom remains,
      # preventing a single future workload from restarting the whole web service.
      - key: HEAVY_CHILD_MEMORY_RESERVE_MB
        value: 96
      - key: HEAVY_CHILD_MEMORY_POLL_SECONDS
        value: 0.05
      - key: BACKTEST_MAX_WINDOW_DAYS
        value: 10980
      - key: BACKTEST_MAX_TICKERS
        value: 900
      - key: BACKTEST_MAX_POSITIONS
        value: 20
      - key: SEC_USER_AGENT
        sync: false
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_SESSION_TTL_SECONDS
        value: 604800
      - key: ASSISTANT_RATE_LIMIT_PER_MINUTE
        value: 20
      - key: PAPER_TRADING_RATE_LIMIT_PER_MINUTE
        value: 240
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: 12
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_INPUT_USD_PER_MILLION
        value: 2.0
      - key: OPENAI_CACHED_INPUT_USD_PER_MILLION
        value: 0.2
      - key: OPENAI_OUTPUT_USD_PER_MILLION
        value: 12.0
      - key: OPENAI_GLOBAL_BUDGET_USD
        value: 25.0
      - key: OPENAI_QA_BUDGET_USD
        value: 10.0
      # Exact paid local release-QA spend carried into the production ceiling.
      - key: OPENAI_CARRYOVER_SPEND_USD
        value: 0.203911
      - key: OPENAI_CARRYOVER_QA_SPEND_USD
        value: 0.203911
      - key: OPENAI_USAGE_MODE
        value: production
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: 3000
      - key: OPENAI_MAX_TOOL_ROUNDS
        value: 6
      - key: OPENAI_TIMEOUT_SECONDS
        value: 45
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
